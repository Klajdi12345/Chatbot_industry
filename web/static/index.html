<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmaBot</title>
<link rel="icon" type="image/png" href="/assets/ikona.png">
<script>
  // Tema vendoset para se të vizatohet faqja (pa "flash" të bardhë në temën e zezë).
  (function () {
    var t = "system";
    try { t = localStorage.getItem("fb.tema") || "system"; } catch (e) {}
    var erret = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", erret ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="/static/app.css?v=6">
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script src="/static/app.js?v=6"></script>
</body>
</html>
